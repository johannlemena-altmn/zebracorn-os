<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c4623d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="md studio">
<title>md studio — md → présentable</title>
<style>
  /* ── Design system frugal (famille Zebracorn : papier / encre / terracotta) ──
     Polices système uniquement → zéro CDN, marche 100 % offline. */
  :root{
    --papier:#f6f3ec; --papier-2:#efe9dd; --encre:#2b2723; --encre-2:#5b544c;
    --terracotta:#c4623d; --trait:#d9d0c0; --blanc:#fffdf8;
    --r:14px; --pad:16px;
  }
  @media (prefers-color-scheme: dark){
    :root{ --papier:#1c1a17; --papier-2:#23201c; --encre:#ece6db; --encre-2:#a9a195;
           --trait:#37322b; --blanc:#211e1a; }
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  /* [hidden] doit toujours gagner, même sur un sélecteur #id avec display: */
  [hidden]{ display:none !important; }
  html,body{ margin:0; height:100%; }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--papier); color:var(--encre);
    -webkit-text-size-adjust:100%;
  }
  .app{ display:flex; flex-direction:column; height:100%;
        padding-top:env(safe-area-inset-top); }
  header{
    display:flex; align-items:center; gap:10px; padding:10px var(--pad);
    border-bottom:1px solid var(--trait); background:var(--papier-2);
    position:sticky; top:0; z-index:5;
  }
  header h1{ font-size:15px; margin:0; font-weight:650; letter-spacing:.2px; flex:1; }
  header h1 b{ color:var(--terracotta); }
  .seg{ display:flex; background:var(--papier); border:1px solid var(--trait);
        border-radius:10px; overflow:hidden; }
  .seg button{ border:0; background:transparent; color:var(--encre-2);
        font:inherit; font-size:13px; padding:7px 12px; }
  .seg button[aria-pressed="true"]{ background:var(--terracotta); color:#fff; font-weight:600; }
  main{ flex:1; min-height:0; display:flex; }
  /* Édition */
  #editor{ flex:1; border:0; resize:none; padding:var(--pad);
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:14px; line-height:1.55; background:var(--papier); color:var(--encre);
    outline:none; width:100%; }
  /* Aperçu */
  #preview-wrap{ flex:1; overflow:auto; -webkit-overflow-scrolling:touch;
    display:flex; justify-content:center; background:var(--papier); }
  .doc{ background:var(--blanc); color:var(--encre); width:100%; max-width:720px;
    margin:18px; padding:30px 34px; border:1px solid var(--trait); border-radius:var(--r);
    box-shadow:0 1px 0 rgba(0,0,0,.03); line-height:1.62; font-size:16px;
    overflow-wrap:break-word; }
  .doc h1,.doc h2,.doc h3{ font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    line-height:1.25; margin:1.3em 0 .5em; font-weight:650; }
  .doc h1{ font-size:1.7em; margin-top:0; }
  .doc h2{ font-size:1.35em; border-bottom:1px solid var(--trait); padding-bottom:.18em; }
  .doc h3{ font-size:1.13em; }
  .doc p{ margin:.7em 0; }
  .doc a{ color:var(--terracotta); }
  .doc strong{ font-weight:680; }
  .doc ul,.doc ol{ margin:.6em 0; padding-left:1.4em; }
  .doc li{ margin:.25em 0; }
  .doc blockquote{ margin:.9em 0; padding:.2em 0 .2em 1em; border-left:3px solid var(--terracotta);
    color:var(--encre-2); font-style:italic; }
  .doc code{ font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:.88em;
    background:var(--papier-2); padding:.12em .4em; border-radius:6px; }
  .doc pre{ background:var(--papier-2); padding:14px 16px; border-radius:10px; overflow:auto;
    border:1px solid var(--trait); }
  .doc pre code{ background:none; padding:0; font-size:.86em; line-height:1.5; }
  .doc hr{ border:0; border-top:1px solid var(--trait); margin:1.6em 0; }
  .doc img{ max-width:100%; border-radius:8px; }
  .doc table{ border-collapse:collapse; width:100%; margin:.8em 0; font-size:.95em; }
  .doc th,.doc td{ border:1px solid var(--trait); padding:6px 10px; text-align:left; }
  .doc th{ background:var(--papier-2); }
  .doc .empty{ color:var(--encre-2); font-style:italic; }
  /* Barre d'actions */
  footer{ display:flex; gap:8px; padding:10px var(--pad);
    padding-bottom:calc(10px + env(safe-area-inset-bottom));
    border-top:1px solid var(--trait); background:var(--papier-2);
    overflow-x:auto; }
  footer button{ flex:0 0 auto; border:1px solid var(--trait); background:var(--blanc);
    color:var(--encre); font:inherit; font-size:13px; font-weight:600; padding:9px 14px;
    border-radius:10px; }
  footer button.primary{ background:var(--terracotta); color:#fff; border-color:var(--terracotta); }
  footer button:active{ transform:translateY(1px); }
  .hint{ font-size:12px; color:var(--encre-2); padding:6px var(--pad) 0; }
  .toast{ position:fixed; left:50%; bottom:calc(72px + env(safe-area-inset-bottom));
    transform:translateX(-50%); background:var(--encre); color:var(--papier);
    padding:9px 16px; border-radius:20px; font-size:13px; opacity:0; pointer-events:none;
    transition:opacity .2s; z-index:20; max-width:90%; text-align:center; }
  .toast.show{ opacity:.96; }
  input[type=file]{ display:none; }
  /* Bottom-sheet Modèles */
  .scrim{ position:fixed; inset:0; background:rgba(0,0,0,.35); opacity:0; pointer-events:none;
    transition:opacity .2s; z-index:30; }
  .scrim.show{ opacity:1; pointer-events:auto; }
  .sheet{ position:fixed; left:0; right:0; bottom:0; z-index:31; background:var(--papier);
    border-top-left-radius:18px; border-top-right-radius:18px; border-top:1px solid var(--trait);
    padding:8px 14px calc(16px + env(safe-area-inset-bottom)); transform:translateY(100%);
    transition:transform .22s ease; max-width:560px; margin:0 auto; }
  .sheet.show{ transform:translateY(0); }
  .sheet .grip{ width:38px; height:4px; border-radius:2px; background:var(--trait);
    margin:6px auto 10px; }
  .sheet h2{ font-size:14px; margin:2px 4px 8px; color:var(--encre-2); font-weight:600; }
  .sheet button.tpl{ display:block; width:100%; text-align:left; border:1px solid var(--trait);
    background:var(--blanc); color:var(--encre); font:inherit; padding:12px 14px; border-radius:12px;
    margin-bottom:8px; }
  .sheet button.tpl b{ display:block; font-size:14px; font-weight:650; }
  .sheet button.tpl span{ display:block; font-size:12px; color:var(--encre-2); margin-top:2px; }
  /* Impression → PDF (partage iOS « Enregistrer en PDF ») */
  @media print{
    header,footer,.hint{ display:none !important; }
    .app,main,#preview-wrap{ display:block; height:auto; overflow:visible; }
    body{ background:#fff; }
    .doc{ box-shadow:none; border:0; margin:0; max-width:none; padding:0; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>md<b>·</b>studio</h1>
    <div class="seg" role="tablist">
      <button id="tab-edit" aria-pressed="true">Écrire</button>
      <button id="tab-view" aria-pressed="false">Aperçu</button>
    </div>
  </header>

  <main>
    <textarea id="editor" spellcheck="false" placeholder="Colle ou écris ton Markdown ici…

# Titre
Texte avec **gras**, *italique*, [lien](https://exemple.fr) et `code`.

- liste
- à puces

> citation"></textarea>
    <div id="preview-wrap" hidden><article class="doc" id="preview"></article></div>
  </main>

  <footer>
    <button id="btn-tpl">Modèles</button>
    <button id="btn-open">Ouvrir</button>
    <button id="btn-export" class="primary">Exporter ▾</button>
    <button id="btn-clear">Vider</button>
    <input type="file" id="file" accept=".md,.markdown,.txt,text/markdown,text/plain">
  </footer>
</div>
<div class="toast" id="toast"></div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-label="Modèles">
  <div class="grip"></div>
  <h2>Partir d’un modèle</h2>
  <button class="tpl" data-tpl="spike"><b>Verdict de spike</b><span>Hypothèse → verdict → facile / coince → prochaine étape</span></button>
  <button class="tpl" data-tpl="decision"><b>Note de décision</b><span>Contexte → options → décision → pourquoi → conséquences</span></button>
  <button class="tpl" data-tpl="data"><b>Données → récit</b><span>Le chiffre clé → ce qu’il raconte → la nuance → tableau</span></button>
</div>
<div class="sheet" id="sheet-export" role="dialog" aria-label="Exporter">
  <div class="grip"></div>
  <h2>Exporter</h2>
  <button class="tpl" id="btn-pdf"><b>PDF</b><span>Impression → « Enregistrer en PDF » (iOS)</span></button>
  <button class="tpl" id="btn-html"><b>HTML autonome</b><span>Fichier .html qui s’ouvre partout, styles inclus</span></button>
  <button class="tpl" id="btn-png"><b>Image PNG</b><span>Capture du rendu (best-effort ; sinon PDF)</span></button>
  <button class="tpl" id="btn-copy"><b>Copier le rendu</b><span>Texte mis en forme dans le presse-papier</span></button>
</div>

<script>
/* ──────────────────────────────────────────────────────────────────────────
   md studio — convertisseur Markdown → présentable, 100 % autonome.
   Aucune dépendance externe : un mini-parseur Markdown inline (sous-ensemble
   courant). Choix frugal : couvrir ce qui sert vraiment (titres, gras/ital,
   listes, code, citations, liens, images, hr, tableaux simples) plutôt qu'une
   lib complète. Marche offline, testable sans réseau.
   ────────────────────────────────────────────────────────────────────────── */

const $ = s => document.querySelector(s);
const editor = $('#editor'), preview = $('#preview'), previewWrap = $('#preview-wrap');

/* ── escape HTML (sécurité + rendu prévisible) ── */
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ── inline : code, gras, italique, liens, images ── */
function inline(s){
  // code inline d'abord (protège le reste)
  const codes = [];
  s = s.replace(/`([^`]+)`/g, (_,c)=>{ codes.push('<code>'+esc(c)+'</code>'); return '␀'+(codes.length-1)+'␀'; });
  s = esc(s);
  // images ![alt](src)
  s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)[^)]*\)/g, (_,a,src)=>'<img alt="'+a+'" src="'+src+'">');
  // liens [txt](url)
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)[^)]*\)/g, (_,t,u)=>'<a href="'+u+'" target="_blank" rel="noopener">'+t+'</a>');
  // gras puis italique
  s = s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/__([^_]+)__/g,'<strong>$1</strong>');
  s = s.replace(/\*([^*]+)\*/g,'<em>$1</em>').replace(/(^|[\s(])_([^_]+)_/g,'$1<em>$2</em>');
  // restaure le code inline
  s = s.replace(/␀(\d+)␀/g,(_,i)=>codes[+i]);
  return s;
}

/* ── parse une ligne de tableau « | a | b | » ── */
function isTableSep(l){ return /^\s*\|?[\s:|-]+\|[\s:|-]+\|?\s*$/.test(l) && l.includes('-'); }
function cells(l){ return l.replace(/^\s*\|/,'').replace(/\|\s*$/,'').split('|').map(c=>c.trim()); }

/* ── parseur block-level ── */
function mdToHtml(src){
  src = src.replace(/\r\n?/g,'\n');
  const lines = src.split('\n');
  let html = '', i = 0;
  const flushParagraph = buf => { if(buf.length){ html += '<p>'+inline(buf.join(' '))+'</p>'; buf.length=0; } };

  while(i < lines.length){
    let line = lines[i];

    // fenced code ```
    if(/^\s*```/.test(line)){
      const lang = line.replace(/^\s*```/,'').trim();
      i++; const code = [];
      while(i < lines.length && !/^\s*```/.test(lines[i])){ code.push(lines[i]); i++; }
      i++; // saute la fence fermante
      html += '<pre><code'+(lang?' class="lang-'+esc(lang)+'"':'')+'>'+esc(code.join('\n'))+'</code></pre>';
      continue;
    }
    // hr
    if(/^\s*([-*_])(\s*\1){2,}\s*$/.test(line)){ html += '<hr>'; i++; continue; }
    // titres
    const h = line.match(/^(#{1,6})\s+(.*)$/);
    if(h){ const n = h[1].length; html += '<h'+n+'>'+inline(h[2].trim())+'</h'+n+'>'; i++; continue; }
    // citation (regroupe les lignes >)
    if(/^\s*>\s?/.test(line)){
      const q = [];
      while(i < lines.length && /^\s*>\s?/.test(lines[i])){ q.push(lines[i].replace(/^\s*>\s?/,'')); i++; }
      html += '<blockquote>'+mdToHtml(q.join('\n'))+'</blockquote>';
      continue;
    }
    // tableau (en-tête + séparateur)
    if(line.includes('|') && i+1 < lines.length && isTableSep(lines[i+1])){
      const head = cells(line); i += 2;
      let t = '<table><thead><tr>'+head.map(c=>'<th>'+inline(c)+'</th>').join('')+'</tr></thead><tbody>';
      while(i < lines.length && lines[i].includes('|') && lines[i].trim()!==''){
        t += '<tr>'+cells(lines[i]).map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>'; i++;
      }
      html += t+'</tbody></table>'; continue;
    }
    // listes (puces ou numérotées, consécutives)
    const ul = line.match(/^\s*[-*+]\s+(.*)$/), ol = line.match(/^\s*\d+\.\s+(.*)$/);
    if(ul || ol){
      const ordered = !!ol; const items = [];
      const re = ordered ? /^\s*\d+\.\s+(.*)$/ : /^\s*[-*+]\s+(.*)$/;
      while(i < lines.length){ const m = lines[i].match(re); if(!m) break; items.push(m[1]); i++; }
      html += (ordered?'<ol>':'<ul>') + items.map(it=>'<li>'+inline(it)+'</li>').join('') + (ordered?'</ol>':'</ul>');
      continue;
    }
    // ligne vide
    if(line.trim()===''){ i++; continue; }
    // paragraphe (accumule jusqu'à une ligne vide / un bloc)
    const para = [];
    while(i < lines.length && lines[i].trim()!=='' &&
          !/^\s*(#{1,6}\s|>|```|[-*+]\s|\d+\.\s)/.test(lines[i]) &&
          !/^\s*([-*_])(\s*\1){2,}\s*$/.test(lines[i])){
      para.push(lines[i]); i++;
    }
    flushParagraph(para);
  }
  return html;
}

/* ── rendu live + persistance ── */
const KEY = 'mdstudio_draft';
function render(){
  const src = editor.value;
  preview.innerHTML = src.trim() ? mdToHtml(src)
    : '<p class="empty">Rien à afficher — écris du Markdown dans l’onglet « Écrire ».</p>';
  try{ localStorage.setItem(KEY, src); }catch(e){}
}
editor.addEventListener('input', render);

/* ── onglets ── */
function setTab(view){
  $('#tab-edit').setAttribute('aria-pressed', String(!view));
  $('#tab-view').setAttribute('aria-pressed', String(view));
  editor.hidden = view; previewWrap.hidden = !view;
  if(view) render();
}
$('#tab-edit').onclick = ()=>setTab(false);
$('#tab-view').onclick = ()=>setTab(true);

/* ── toast ── */
let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'), 1900); }

/* ── ouvrir un .md ── */
$('#btn-open').onclick = ()=>$('#file').click();
$('#file').onchange = e=>{
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{ editor.value = r.result; render(); toast('« '+f.name+' » chargé'); };
  r.readAsText(f); e.target.value='';
};

/* ── document HTML autonome (styles inline → s’ouvre seul partout) ── */
function standaloneHtml(){
  const title = (editor.value.match(/^#\s+(.+)$/m)||[])[1] || 'Document';
  const css = `body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;`
    +`line-height:1.62;color:#2b2723;background:#f6f3ec;margin:0;padding:28px}`
    +`.doc{background:#fffdf8;max-width:720px;margin:0 auto;padding:30px 34px;border-radius:14px;`
    +`border:1px solid #d9d0c0;font-size:16px;overflow-wrap:break-word}`
    +`h1,h2,h3{font-family:"Iowan Old Style",Palatino,Georgia,serif;line-height:1.25;margin:1.3em 0 .5em}`
    +`h1{font-size:1.7em;margin-top:0}h2{font-size:1.35em;border-bottom:1px solid #d9d0c0;padding-bottom:.18em}`
    +`a{color:#c4623d}blockquote{margin:.9em 0;padding:.2em 0 .2em 1em;border-left:3px solid #c4623d;color:#5b544c;font-style:italic}`
    +`code{font-family:ui-monospace,Menlo,Consolas,monospace;background:#efe9dd;padding:.12em .4em;border-radius:6px;font-size:.88em}`
    +`pre{background:#efe9dd;padding:14px 16px;border-radius:10px;overflow:auto;border:1px solid #d9d0c0}`
    +`pre code{background:none;padding:0}hr{border:0;border-top:1px solid #d9d0c0;margin:1.6em 0}`
    +`img{max-width:100%;border-radius:8px}table{border-collapse:collapse;width:100%}`
    +`th,td{border:1px solid #d9d0c0;padding:6px 10px;text-align:left}th{background:#efe9dd}`;
  return '<!doctype html><html lang="fr"><head><meta charset="utf-8">'
    +'<meta name="viewport" content="width=device-width,initial-scale=1">'
    +'<title>'+esc(title)+'</title><style>'+css+'</style></head>'
    +'<body><article class="doc">'+mdToHtml(editor.value)+'</article></body></html>';
}
function download(name, content, type){
  const blob = new Blob([content], {type});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=name; a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}
$('#btn-html').onclick = ()=>{
  if(!editor.value.trim()) return toast('Rien à exporter');
  closeSheets();
  download('document.html', standaloneHtml(), 'text/html'); toast('HTML exporté');
};

/* ── PDF : impression native (iOS → partage « Enregistrer en PDF ») ── */
$('#btn-pdf').onclick = ()=>{ if(!editor.value.trim()) return toast('Rien à exporter');
  closeSheets(); setTab(true); setTimeout(()=>window.print(), 220); };

/* ── PNG : best-effort via SVG <foreignObject> → canvas.
   Note honnête : marche bien sur Chrome/desktop ; Safari iOS peut refuser
   (canvas « tainted ») surtout avec des images distantes. Fallback : message. ── */
$('#btn-png').onclick = async ()=>{
  if(!editor.value.trim()) return toast('Rien à exporter');
  closeSheets();
  try{
    const w = Math.min(preview.scrollWidth||720, 720);
    const inner = '<div xmlns="http://www.w3.org/1999/xhtml" style="background:#fffdf8;color:#2b2723;'
      +'font-family:-apple-system,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.6;'
      +'padding:30px 34px;width:'+(w-0)+'px;box-sizing:border-box">'+mdToHtml(editor.value)+'</div>';
    const h = preview.scrollHeight + 80;
    const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+h+'">'
      +'<foreignObject width="100%" height="100%">'+inner+'</foreignObject></svg>';
    const img = new Image();
    img.onload = ()=>{
      const scale = 2, c = document.createElement('canvas');
      c.width = w*scale; c.height = h*scale;
      const ctx = c.getContext('2d'); ctx.scale(scale,scale);
      ctx.fillStyle = '#fffdf8'; ctx.fillRect(0,0,w,h);
      ctx.drawImage(img,0,0);
      c.toBlob(b=>{ if(!b) return toast('PNG non supporté ici — utilise PDF');
        const u=URL.createObjectURL(b); const a=document.createElement('a');
        a.href=u; a.download='document.png'; a.click(); setTimeout(()=>URL.revokeObjectURL(u),1000);
        toast('PNG exporté'); }, 'image/png');
    };
    img.onerror = ()=>toast('PNG non supporté ici — utilise PDF');
    img.src = 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
  }catch(e){ toast('PNG non supporté ici — utilise PDF'); }
};

/* ── copier le rendu (HTML riche si possible, sinon source) ── */
$('#btn-copy').onclick = async ()=>{
  if(!editor.value.trim()) return toast('Rien à copier');
  closeSheets();
  try{
    if(window.ClipboardItem && navigator.clipboard?.write){
      const html = standaloneHtml();
      await navigator.clipboard.write([new ClipboardItem({
        'text/html': new Blob([html],{type:'text/html'}),
        'text/plain': new Blob([editor.value],{type:'text/plain'}),
      })]); toast('Rendu copié');
    }else{ await navigator.clipboard.writeText(editor.value); toast('Markdown copié'); }
  }catch(e){ toast('Copie impossible'); }
};

/* ── vider ── */
$('#btn-clear').onclick = ()=>{ if(!editor.value.trim()) return;
  if(confirm('Vider l’éditeur ?')){ editor.value=''; render(); setTab(false); } };

/* ── Modèles (gabarits narratifs — esprit Ferryman : du structuré au récit).
   Génériques par choix : les vrais gabarits éditoriaux Ferryman se brancheront
   quand le repo sera accessible ; ici, des amorces utiles tout de suite. ── */
const TEMPLATES = {
  spike:
`# Spike — [hypothèse]

**Hypothèse testée :** …

**Verdict :** ✅ confirmée · ⚠️ confirmée avec réserves · ❌ infirmée

## Ce qui est facile
- …

## Ce qui coince
- …

## Prochaine étape qui tranche
…`,
  decision:
`# Décision — [sujet]

**Contexte :** …

## Options
1. **Option A** — …

};
const scrim = $('#scrim');
function closeSheets(){ document.querySelectorAll('.sheet').forEach(s=>s.classList.remove('show')); scrim.classList.remove('show'); }
function openSheet(el){ closeSheets(); el.classList.add('show'); scrim.classList.add('show'); }
scrim.onclick = closeSheets;
$('#btn-tpl').onclick = ()=>openSheet($('#sheet'));
$('#btn-export').onclick = ()=>{ if(!editor.value.trim()) return toast('Rien à exporter'); openSheet($('#sheet-export')); };
// Seuls les boutons modèles (data-tpl) — pas les boutons d'export qui partagent .tpl
document.querySelectorAll('#sheet .tpl').forEach(b => b.onclick = ()=>{
  const tpl = TEMPLATES[b.dataset.tpl]; if(!tpl) return;
  if(editor.value.trim() && !confirm('Remplacer le contenu actuel par ce modèle ?')) return;
  editor.value = tpl; render(); setTab(false); closeSheets(); editor.focus();
  toast('Modèle inséré');
});

/* ── partage entrant : ?text= / ?title= (share_target ou deep-link) ── */
function fromShare(){
  try{
    const p = new URLSearchParams(location.search);
    const text = p.get('text'), title = p.get('title'), url = p.get('url');
    if(!text && !title && !url) return false;
    let md = '';
    if(title) md += '# '+title+'\n\n';
    if(text)  md += text;
    if(url)   md += (md?'\n\n':'') + url;
    editor.value = md.trim();
    history.replaceState(null, '', location.pathname); // nettoie l'URL
    return true;
  }catch(e){ return false; }
}

/* ── boot : partage entrant prioritaire, sinon brouillon restauré ── */
if(!fromShare()){
  try{ const s = localStorage.getItem(KEY); if(s) editor.value = s; }catch(e){}
}
render();

/* ── service worker (offline + installable « Ajouter à l'écran d'accueil ») ── */
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
