function pickQ(mode){
  const qs=RAIL_Q[mode];
  const doy=Math.floor((Date.now()-new Date(new Date().getFullYear(),0,0))/86400000);
  return qs[doy%qs.length];
}

];
function seededShuffle(arr, seed) {
  const a = [...arr];
  let s = Math.abs(seed) >>> 0;
  for (let i = a.length - 1; i > 0; i--) {
    s = ((s * 1664525) + 1013904223) & 0x7fffffff;
    const j = s % (i + 1);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function weekKey(){
  const d=new Date(),jan1=new Date(d.getFullYear(),0,1);
  const wn=Math.ceil((((d-jan1)/86400000)+jan1.getDay()+1)/7);
  return `revue_${d.getFullYear()}_W${String(wn).padStart(2,'0')}`;
}
function getRevue(){ try{return JSON.parse(localStorage.getItem(weekKey())||'null')||{r1:'',r2:'',r3:'',done:false};}catch{return{r1:'',r2:'',r3:'',done:false};} }
function saveRevue(data){ localStorage.setItem(weekKey(),JSON.stringify(data)); }

/* ── Google Calendar iCal ───────────────────── */
function unfoldIcal(t){ return t.replace(/\r\n[ \t]/g,'').replace(/\n[ \t]/g,''); }
function parseIcal(text){
  const evts=[];
  for(const block of text.split('BEGIN:VEVENT').slice(1)){
    const get=key=>{const m=block.match(new RegExp('^'+key+'[^\\r\\n]*:([^\\r\\n]+)','m'));return m?m[1].trim():'';};
    const dtstart=(()=>{const m=block.match(/^DTSTART[^\r\n]*/m);return m?m[0].split(':').pop().trim():'';})();
    const summary=get('SUMMARY').replace(/\\,/g,',').replace(/\\n/g,' ').replace(/\\/g,'');
    if(summary) evts.push({dtstart,summary});
  }
  return evts;
}
function fmtGcalTime(dtstart){
  if(!dtstart||!dtstart.includes('T')) return 'Journée';
  const s=dtstart.replace(/Z$/,'');
  if(dtstart.endsWith('Z')){
    const d=new Date(`${s.slice(0,4)}-${s.slice(4,6)}-${s.slice(6,8)}T${s.slice(9,11)}:${s.slice(11,13)}:00Z`);
    return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
  }
  return `${s.slice(9,11)}:${s.slice(11,13)}`;
}
function filterToday(evts){
  const td=new Date().toISOString().slice(0,10).replace(/-/g,'');
  return evts.filter(e=>e.dtstart.startsWith(td));
}
async function loadGcalEvents(){
  const raw=localStorage.getItem('zc_gcal_url');
  if(!raw) return null;
  const urls=raw.split('\n').map(u=>u.trim()).filter(u=>u.startsWith('https://calendar.google.com/calendar/ical/'));
  if(!urls.length) return null;
  const all=[];
  for(const url of urls){
    try{
      const r=await fetch(`/api/ical?url=${encodeURIComponent(url)}`);
      if(!r.ok) continue;
      const text=await r.text();
      all.push(...filterToday(parseIcal(unfoldIcal(text))));
    }catch{}
  }
  return all.sort((a,b)=>a.dtstart<b.dtstart?-1:1);
}

/* ── helpers ────────────────────────────────── */
function fmtDate(d){ return `${DAYS[d.getDay()]}. ${d.getDate()} ${MONTHS[d.getMonth()]}`; }
function fmtTime(d){ return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
function relDate(iso){
  const h=(Date.now()-new Date(iso))/3600000;
  return h<1?"à l'instant":h<24?`il y a ${Math.floor(h)} h`:h<48?'hier':`il y a ${Math.floor(h/24)} j`;
}
function fmtEch(ech){
  if(!ech) return null;
  const td=new Date().toISOString().slice(0,10);
  const tm=new Date(Date.now()+86400000).toISOString().slice(0,10);
  const d=new Date(ech+'T12:00:00');
  if(ech<td)  return {label:'⚠ Retard',urgent:true};
  if(ech===td) return {label:'⚠ Auj.',urgent:true};
  if(ech===tm) return {label:'⚠ Demain',urgent:true};
  return {label:`${DAYS[d.getDay()]} ${d.getDate()}`,urgent:false};
}
function sortByEch(arr){
  return [...arr].sort((a,b)=>{
    if(a.echeance&&b.echeance) return a.echeance<b.echeance?-1:1;
    if(a.echeance) return -1;
    if(b.echeance) return 1;
    return 0;
  });
}
function parseNotes(str){
  if(!str) return [];
  return str.split('\n').map(line=>{
    if(/^\[ \]/.test(line)) return {type:'todo',done:false,text:line.slice(4)};
    if(/^\[x\]/i.test(line)) return {type:'todo',done:true,text:line.slice(4)};
    return {type:'text',text:line};
  });
}
function toggleSubtaskLine(str,idx){
  const lines=str.split('\n');
  if(/^\[ \]/.test(lines[idx])) lines[idx]='[x]'+lines[idx].slice(3);
  else if(/^\[x\]/i.test(lines[idx])) lines[idx]='[ ]'+lines[idx].slice(3);
  return lines.join('\n');
}

function useTypewriter(text,speed=30){
  const [d,setD]=useState('');
  useEffect(()=>{
    setD(''); let i=0;
    const t=setInterval(()=>{ i++; setD(text.slice(0,i)); if(i>=text.length)clearInterval(t); },speed);
    return()=>clearInterval(t);
  },[text]);
  return d;
}
function useClock(){
  const [n,setN]=useState(new Date());
  useEffect(()=>{ const t=setInterval(()=>setN(new Date()),30000); return()=>clearInterval(t); },[]);
  return n;
}

/* ── AmwapModal ──────────────────────────────── */
const AMWAP_PH = [
  'Victoire n°1 — grande ou petite…',
  'Victoire n°2…',
  'Victoire n°3 — même un micro-geste compte…',
];
function AmwapModal({onClose,onSave}){
  const [vs,setVs]=useState(['','','']);
  const [sent,setSent]=useState(false);
  const set=(i,v)=>setVs(p=>p.map((x,j)=>j===i?v:x));
  async function valider(){
    if(!vs[0].trim()) return;
    await saveAmwap(vs[0],vs[1],vs[2]);
    setSent(true);
    setTimeout(()=>{ onSave(); onClose(); },650);
  }
  return html`<div class="modal-ov" onClick=${e=>e.target===e.currentTarget&&onClose()}>
    <div class="modal-sh">
      <div class="modal-hdl"/>
      <div class="sec-t" style="display:block;margin-bottom:1.1rem">AMWAP · Mes victoires du jour</div>
      ${sent
        ? html`<div class="amwap-ok">✓ Victoires enregistrées</div>`
        : html`<div>
          ${[0,1,2].map(i=>html`<div style="margin-bottom:9px" key=${i}>
            <div class="set-label">${i+1}.</div>
            <input class="taginp" style="width:100%" value=${vs[i]} onInput=${e=>set(i,e.target.value)} placeholder=${AMWAP_PH[i]} onKeyDown=${e=>e.key==='Enter'&&(i<2?e.target.closest('.modal-sh').querySelectorAll('.taginp')[i+1]?.focus():valider())}/>
          </div>`)}
          <button class="save-btn" style="width:100%;margin-top:6px" onClick=${valider} disabled=${!vs[0].trim()}>Valider mes victoires ✓</button>
          <div class="hint" style="text-align:center;margin-top:8px">Tes victoires restent ici — privées, locales.</div>
        </div>`}
    </div>
  </div>`;
}

/* ── Maintenant ─────────────────────────────── */
function Maintenant({inboxCount,onGoCapture}){
  const [mode,setMode]=useState('fort');
  const [selQ,setSelQ]=useState(()=>pickQ('fort'));
  function changeMode(m){ setMode(m); setSelQ(pickQ(m)); }
  const [intent,setIntent]=useState('');
  const [dayTasks,setDayTasks]=useState([]);
  const [routs,setRouts]=useState([false,false,false]);
  const [streaks,setStreaks]=useState([0,0,0]);
  const [week,setWeek]=useState([]);
  const [caps,setCaps]=useState([]);
  const [amwapOpen,setAmwapOpen]=useState(false);
  const [amwapYest,setAmwapYest]=useState(null);
  const [cap,setCap]=useState(getCap());
  const [hsCount,setHsCount]=useState(0);
  const [revue,setRevue]=useState(getRevue);
  const [revueOpen,setRevueOpen]=useState(()=>new Date().getDay()===5&&!getRevue().done);
  const [gcalEvts,setGcalEvts]=useState(null);
  const [livreEnCours,setLivreEnCours]=useState(null);
  const [resurfItems,setResurfItems]=useState([]);
  const [expandTaskId,setExpandTaskId]=useState(null);
  const [expandNotes,setExpandNotes]=useState('');
  const [editNotesId,setEditNotesId]=useState(null);
  const typed=useTypewriter(selQ);
  const now=useClock();

  const load=useCallback(async()=>{
    setIntent(await getTodayIntention());
    setWeek(await getWeekData());
    const undone=await getTaches({fait:false});
    setDayTasks([...undone.filter(t=>t.prio==='rouge'),...undone.filter(t=>t.prio==='bleu')].slice(0,3));
    setRouts(await Promise.all(DEF_ROUTINES.map(r=>getRoutineCheck(r.key))));
    setStreaks(await Promise.all(DEF_ROUTINES.map(r=>getStreak(r.key))));
    setCaps((await getInbox()).slice(0,4));
    const surf=await getResurfaceCandidates();
    const surfSeed=parseInt(new Date().toISOString().slice(0,10).replace(/-/g,''));
    setResurfItems(seededShuffle(surf,surfSeed).slice(0,3));
    const yest=new Date(); yest.setDate(yest.getDate()-1);
    setAmwapYest(await getAmwap(yest.toISOString().slice(0,10)));
    setCap(await getCap());
    setHsCount(await getHorsScopeMois());
    setLivreEnCours(await getLivreEnCours());
    loadGcalEvents().then(setGcalEvts).catch(()=>{});
  },[]);
  useEffect(()=>{ load(); },[load]);

  async function blurIntent(){ await saveIntention(intent); setWeek(await getWeekData()); }
  async function togTask(id){ const t=dayTasks.find(x=>x.id===id); await toggleTacheDone(id,!t.fait); setDayTasks(dayTasks.map(x=>x.id===id?{...x,fait:!x.fait}:x)); }
  function toggleExpandTask(id,notes){ if(expandTaskId===id){setExpandTaskId(null);setExpandNotes('');}else{setExpandTaskId(id);setExpandNotes(notes||'');} }
  async function sauveTaskNotes(id,val){ await setTacheNotes(id,val); setDayTasks(prev=>prev.map(t=>t.id===id?{...t,notes:val||null}:t)); }
  async function togRout(i){
    if(i===2&&!routs[2]){ setAmwapOpen(true); return; }
    const v=!routs[i]; setRouts(routs.map((x,j)=>j===i?v:x));
    await toggleRoutineCheck(DEF_ROUTINES[i].key,v);
    const s=await getStreak(DEF_ROUTINES[i].key); setStreaks(p=>p.map((x,j)=>j===i?s:x));
  }
  async function onAmwapSave(){
    setRouts(p=>p.map((x,j)=>j===2?true:x));
    await toggleRoutineCheck(DEF_ROUTINES[2].key,true);
    const s=await getStreak(DEF_ROUTINES[2].key); setStreaks(p=>p.map((x,j)=>j===2?s:x));
  }

  function updRevue(k,v){ const r={...revue,[k]:v}; setRevue(r); saveRevue(r); }
  function cloreRevue(){ const r={...revue,done:true}; setRevue(r); saveRevue(r); setRevueOpen(false); }

  async function markRevu(id){
    await updateCaptureLastSurfaced(id);
    setResurfItems(prev=>prev.filter(x=>x.id!==id));
  }
  async function traiterResurface(item){
    if(item.statut!=='inbox'){
      await updateCaptureStatut(item.id,'inbox');
      setResurfItems(prev=>prev.map(x=>x.id===item.id?{...x,statut:'inbox'}:x));
    }
    onGoCapture();
  }

  const done=dayTasks.filter(t=>t.fait).length;
  const idone=week.filter(d=>d.done).length;

  return html`<div class="scroll">
    <div class="hdr"><div class="brand">Zebracorn OS</div><div class="date-lbl">${fmtDate(now)} · ${fmtTime(now)}</div></div>
    <div class="h1">Maintenant.</div>
    <div class="greet">Avant de scroller — une intention, un geste.</div>

    <div class="modes">
      ${Object.keys(RAIL_Q).map(m=>html`<button class=${'mode'+(mode===m?' on':'')} onClick=${()=>changeMode(m)} key=${m}>${m==='fort'?'Intercept fort':m==='relache'?'Relâché':'Libre'}</button>`)}
    </div>

    <div class="rail">
      <div class="rail-k">◇ Le rail · ${mode==='fort'?'matin/journée':mode==='relache'?'pause':'week-end'}</div>
      <div class="rail-q">${typed}${typed.length<selQ.length?html`<span class="cursor"/>`:''}</div>
      <input value=${intent} onInput=${e=>setIntent(e.target.value)} onBlur=${blurIntent} onKeyDown=${e=>e.key==='Enter'&&e.target.blur()} placeholder="Mon intention pour ce moment…"/>
    </div>
    ${cap.intention?html`<div class="cap-annuel">◇ Cap 2026 · <em>${cap.intention}</em></div>`:''}
    ${cap.objectifsMois?html`<div class="cap-annuel" style="margin-top:-0.8rem;opacity:.75">⬡ ${new Date().toLocaleDateString('fr-FR',{month:'long'})} · <em>${cap.objectifsMois.split('\n')[0]}${cap.objectifsMois.split('\n').filter(l=>l.trim()).length>1?' +…':''}</em></div>`:''}

    ${gcalEvts?.length>0?html`<div class="gcal-block">
      <div class="gcal-hdr">◇ Aujourd'hui</div>
      ${gcalEvts.slice(0,6).map((e,i)=>html`<div class="gcal-ev" key=${i}>
        <span class="gcal-time">${fmtGcalTime(e.dtstart)}</span>
        <span class="gcal-ti">${e.summary}</span>
      </div>`)}
    </div>`:gcalEvts!==null&&gcalEvts.length===0?html`<div class="hint" style="margin-bottom:.8rem">◇ Agenda Google · aucun événement aujourd'hui</div>`:''}

    <div class="track">
      <div class="kpi"><div class="kpi-n">${streaks.length?Math.max(...streaks):0}<small> j</small></div><div class="kpi-l">Meilleure série</div></div>
      <div class="week-box">
        <div class="week-l">Intentions tenues · ${idone}/7</div>
        <div class="days">${week.map((d,i)=>html`<div class=${'day'+(d.done?' f3':'')+(d.isToday?' today':'')} key=${i}><b/><span>${DAYS[(new Date(d.date+'T12:00:00')).getDay()][0]}</span></div>`)}</div>
      </div>
    </div>

    <div class="sec">
      <div class="sec-h"><span class="sec-t">3 tâches clés du jour</span><span class="sec-c">${done}/${dayTasks.length||3}</span></div>
      ${dayTasks.length===0?html`<div class="empty-state">Pose tes priorités dans « Semaine » →</div>`:''}
      ${dayTasks.map((t,i)=>{
        const isExp=expandTaskId===t.id;
        const isEdit=editNotesId===t.id;
        const parsed=parseNotes(t.notes);
        const todos=parsed.filter(l=>l.type==='todo');
        const doneC=todos.filter(l=>l.done).length;
        return html`<div class=${'task'+(t.fait?' done':'')+(isExp?' expanded':'')} key=${t.id}>
          <div class="box" onClick=${()=>togTask(t.id)}/>
          <span class="t-txt" onClick=${()=>toggleExpandTask(t.id,t.notes)}>${t.prio==='rouge'?'🔴':'🔵'} ${t.titre}</span>
          <span class="t-toggle" onClick=${()=>toggleExpandTask(t.id,t.notes)}>
            ${todos.length?html`<span class="t-count">${doneC}/${todos.length}</span>`:''}
            ${isExp?'▾':'▸'}
          </span>
          ${isExp?html`<div class="task-notes">
            ${isEdit||!t.notes?html`
              <textarea class="task-notes-ta" rows="5" value=${expandNotes}
                onInput=${e=>setExpandNotes(e.target.value)}
                onBlur=${async()=>{await sauveTaskNotes(t.id,expandNotes);setEditNotesId(null);}}
                placeholder=${'[ ] sous-tâche\n[ ] autre tâche\n— ou note libre…'}
                autofocus/>
            `:html`
              <div class="subtask-list">
                ${parsed.map((line,idx)=>line.type==='todo'?html`
                  <div class=${'subtask'+(line.done?' done':'')} onClick=${async e=>{e.stopPropagation();const n=toggleSubtaskLine(t.notes,idx);await sauveTaskNotes(t.id,n);setDayTasks(prev=>prev.map(x=>x.id===t.id?{...x,notes:n}:x));}} key=${idx}>
                    <span class="st-cb">${line.done?'☑':'☐'}</span>
                    <span class="st-txt">${line.text}</span>
                  </div>
                `:line.text?html`<div class="note-line" key=${idx}>${line.text}</div>`:null)}
                <button class="edit-notes-btn" onClick=${e=>{e.stopPropagation();setEditNotesId(t.id);setExpandNotes(t.notes||'');}}>✎ éditer</button>
              </div>
            `}
          </div>`:null}
        </div>`;
      })}
    </div>

    <div class="sec">
      <div class="sec-h"><span class="sec-t">Routines · ne casse pas la chaîne</span></div>
      ${DEF_ROUTINES.map((r,i)=>html`<div class=${'rout'+(routs[i]?' on':'')} onClick=${()=>togRout(i)} key=${r.key}><div class="dot"/><span class="r-txt">${r.nom}</span><span class="r-mom">${r.moment}</span>${streaks[i]>0?html`<span class="streak">🔥 ${streaks[i]}</span>`:''}</div>`)}
      ${amwapYest?html`<div class="amwap-recap"><span style="color:var(--ink3)">Hier · </span>${amwapYest.v1}${amwapYest.v2?' · '+amwapYest.v2:''}${amwapYest.v3?' · '+amwapYest.v3:''}</div>`:''}
    </div>

    ${amwapOpen?html`<${AmwapModal} onClose=${()=>setAmwapOpen(false)} onSave=${onAmwapSave}/>`:''}

      <div class="hint" style="margin-bottom:10px;font-style:italic">Capturées il y a 7+ jours — toujours pertinent ?</div>

          ${item.type==='croquis'

    ${(caps.length>0||inboxCount>0)?html`<div class="sec">

      <div>${caps.map(c=>html`<span class="chip" onClick=${onGoCapture} key=${c.id}>${T_ICONS[c.type]||'📝'} ${c.contenu.slice(0,30)}</span>`)}</div>

}

/* ── File helpers ────────────────────────────── */
async function compressImage(file,maxW=1400,q=0.82){
  return new Promise((res,rej)=>{
    const img=new Image();
    const url=URL.createObjectURL(file);
    img.onload=()=>{
      const ratio=Math.min(1,maxW/img.width);
      const cv=document.createElement('canvas');
      cv.width=Math.round(img.width*ratio); cv.height=Math.round(img.height*ratio);
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      URL.revokeObjectURL(url);
      res(cv.toDataURL('image/jpeg',q));
    };
    img.onerror=rej; img.src=url;
  });
}
async function readFileAsDataUrl(file){
  return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=e=>res(e.target.result); r.onerror=rej; r.readAsDataURL(file); });
}
async function shareFile(item){
  if(!navigator.share){ alert('Partage non disponible — utilise Safari sur iPhone.'); return; }
  const blob=await fetch(item.dataUrl).then(r=>r.blob());
  const f=new File([blob],item.filename||'fichier',{type:item.mimeType});
  try{ await navigator.share({files:[f],title:item.filename||'Fichier Zebracorn'}); }catch(e){ if(e.name!=='AbortError') alert('Erreur partage : '+e.message); }
}

/* ── Capture ─────────────────────────────────── */
const isAudioUrl=u=>/\.(mp3|wav|ogg|m4a|aac)(\?.*)?$/i.test(u||'');

function Capture({onCapture}){
  const [type,setType]=useState('note');
  const [content,setContent]=useState('');
  const [tag,setTag]=useState('');
  const [inbox,setInbox]=useState([]);
  const [done,setDone]=useState([]);
  const [later,setLater]=useState([]);
  const [saving,setSaving]=useState(false);
  const [hsOpen,setHsOpen]=useState(false);
  const [file,setFile]=useState(null);
  const [fileWarn,setFileWarn]=useState('');
  const [linkCh,setLinkCh]=useState(null);
  const [chList,setChList]=useState([]);
  const [livreList,setLivreList]=useState([]);
  const [linkLivre,setLinkLivre]=useState(null);
  const [annotId,setAnnotId]=useState(null);
  const [annotTxt,setAnnotTxt]=useState('');
  const [confirmDelId,setConfirmDelId]=useState(null);
  const [expandId,setExpandId]=useState(null);
  const [expandNotes,setExpandNotes]=useState('');
  const [linkedCaps,setLinkedCaps]=useState([]);
  const [linkPickerId,setLinkPickerId]=useState(null);
  const [pickerCaps,setPickerCaps]=useState([]);
  const [questions,setQuestions]=useState([]);
  const [qPickerId,setQPickerId]=useState(null);
  const [actorId,setActorId]=useState(null);
  const [actorDraft,setActorDraft]=useState({});
  const [actorSection,setActorSection]=useState('A');
  const [corpus,setCorpus]=useState([]);
  const [filtreIa]=useState(()=>getFiltreIaSettings());
  const [aiLoading,setAiLoading]=useState(null);
  const [aiError,setAiError]=useState(null);

  const load=useCallback(async()=>{
    const[a,b,c,corp]=await Promise.all([getInbox(),getDone(),getLater(),getActorCorpus()]);
    setInbox(a); setDone(b); setLater(c); setCorpus(corp);
  },[]);
  useEffect(()=>{ load(); },[load]);
  useEffect(()=>{ getChantiers().then(setChList); },[]);
  useEffect(()=>{ getQuestions().then(setQuestions); },[]);
  useEffect(()=>{ getLivres().then(ls=>setLivreList(ls.filter(l=>l.statut!=='lu'))); },[]);

  function handleFile(e){
    const f=e.target.files[0]; if(!f) return;
    if(f.type==='application/pdf'&&f.size>MAX_PDF){ setFileWarn(`PDF trop lourd (${(f.size/1024/1024).toFixed(1)} Mo > ${MAX_PDF_MB} Mo). Compresse via Smallpdf, ou partage directement vers NotebookLM depuis Fichiers.`); setFile(null); return; }
    setFileWarn(''); setFile(f);
  }
  async function save(){
    if(type==='fichier'||type==='croquis'){
      if(!file||saving) return;
      setSaving(true);
      let dataUrl, mimeType=file.type, filename=file.name;
      if(file.type.startsWith('image/')) dataUrl=await compressImage(file);
      else dataUrl=await readFileAsDataUrl(file);
      mimeType=file.type.startsWith('image/')?'image/jpeg':file.type;
      await addCapture(type,filename,tag.trim(),{filename,dataUrl,mimeType,...(linkCh?{chantierId:linkCh}:{}),...(linkLivre?{livreId:linkLivre}:{})});
      setFile(null); setTag(''); setLinkCh(null); setLinkLivre(null); setSaving(false);
      await load(); if(onCapture)onCapture(); return;
    }
    if(!content.trim()||saving)return;
    setSaving(true);
    await addCapture(type,content.trim(),tag.trim(),{...(linkCh?{chantierId:linkCh}:{}),...(linkLivre?{livreId:linkLivre}:{})});
    setContent(''); setTag(''); setLinkCh(null); setLinkLivre(null); setSaving(false);
    await load(); if(onCapture)onCapture();
  }
  async function sauveNotes(id,val){
    await updateCaptureNotes(id,val);
    setInbox(prev=>prev.map(x=>x.id===id?{...x,notes:val||null}:x));
  }
  async function toggleExpand(id){
    if(expandId!==null&&expandId!==id&&expandNotes.trim()) await sauveNotes(expandId,expandNotes);
    if(expandId===id){ setExpandId(null); setLinkedCaps([]); setLinkPickerId(null); setQPickerId(null); return; }
    const item=inbox.find(x=>x.id===id);
    setExpandId(id); setExpandNotes(item?.notes||'');
    setAnnotId(null); setLinkPickerId(null); setQPickerId(null); setActorId(null);
    if(item?.linkedIds?.length){
      const caps=await Promise.all(item.linkedIds.map(lid=>db.captures.get(lid)));
      setLinkedCaps(caps.filter(Boolean));
    } else { setLinkedCaps([]); }
  }
  async function ouvrirPicker(id){
    if(linkPickerId===id){ setLinkPickerId(null); return; }
    const all=await db.captures.toArray();
    setPickerCaps(all.filter(c=>c.id!==id).sort((a,b)=>a.date<b.date?1:-1));
    setLinkPickerId(id);
  }
  async function toggleLien(capId,targetId){
    const cap=await db.captures.get(capId);
    const isLinked=(cap?.linkedIds||[]).includes(targetId);
    if(isLinked){
      await unlinkCaptures(capId,targetId);
      setLinkedCaps(prev=>prev.filter(c=>c.id!==targetId));
    } else {
      await linkCaptures(capId,targetId);
      const nc=await db.captures.get(targetId); if(nc) setLinkedCaps(prev=>[...prev,nc]);
    }
    setInbox(prev=>prev.map(x=>{
      if(x.id!==capId) return x;
      const cur=x.linkedIds||[];
      return {...x,linkedIds:isLinked?cur.filter(i=>i!==targetId):[...cur,targetId]};
    }));
  }
  async function linkToQuestion(captureId,qId){
    await linkCaptureToQuestion(captureId,qId||null);
    setInbox(prev=>prev.map(x=>x.id===captureId?{...x,questionId:qId||null}:x));
    if(!qId) setQPickerId(null);
  }
  async function markDone(id){
    const item=inbox.find(x=>x.id===id);
    setAnnotId(id); setAnnotTxt(item?.notes||''); setExpandId(null); setConfirmDelId(null);
  }
  async function validerTrait(id,txt){ await traitCapture(id,txt); setAnnotId(null); setAnnotTxt(''); await load(); if(onCapture)onCapture(); }
  async function skipAnnot(id){ await traitCapture(id,null); setAnnotId(null); await load(); if(onCapture)onCapture(); }
  function ouvrirActor(item){
    if(actorId===item.id){setActorId(null);return;}
    const ex=item.actorAnalysis||{};
    const isNew=!item.actorAnalysis;
    const isNLM=item.source==='NotebookLM'||item.contenu?.includes('notebooklm.google')||item.nlm;
    setActorDraft({
      aim:ex.aim||(isNew&&isNLM?`Session NotebookLM — ${new Date().toLocaleDateString('fr-FR',{day:'numeric',month:'long'})} — quelle question j'explorais ?`:''),
      compress:ex.compress||(isNew?item.contenu.slice(0,500):''),
      faits:ex.test?.faits||'', interp:ex.test?.interp||'',
      croyances:ex.test?.croyances||'', valeurs:ex.test?.valeurs||'',
      question:ex.test?.question||"Qu'est-ce qui devrait être faux pour que cette thèse soit vraie ?",
      own:ex.own||'', runTexte:ex.run?.texte||'', runType:ex.run?.type||'→ Chantier',
    });
    setActorSection('A'); setActorId(item.id); setExpandId(null); setAnnotId(null);
  }
  async function callActorAI(step,extra={}){
    const item=inbox.find(x=>x.id===actorId); if(!item) return null;
    setAiLoading(step); setAiError(null);
    try{
      const r=await fetch('/api/actor-ai',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({step,content:item.contenu,type:item.type,source:item.source||'',compress:actorDraft.compress||'',settings:filtreIa,...extra}),
      });
      const data=await r.json();
      if(!r.ok) throw new Error(data.error||`HTTP ${r.status}`);
      setAiLoading(null); return data;
    }catch(e){ setAiError(e.message); setAiLoading(null); return null; }
  }
  async function genCompress(){
    const data=await callActorAI('compress');
    if(data) setActorDraft(p=>({...p,compress:(data.titre?data.titre+'\n\n':'')+( data.compress||'')}));
  }
  async function genTest(){
    const data=await callActorAI('test');
    if(data) setActorDraft(p=>({...p,faits:data.faits||p.faits,interp:data.interp||p.interp,croyances:data.croyances||p.croyances,valeurs:data.valeurs||p.valeurs,question:data.question||p.question}));
  }

  async function sauveActor(id){
    const a={
      aim:actorDraft.aim, compress:actorDraft.compress,
      test:{faits:actorDraft.faits,interp:actorDraft.interp,croyances:actorDraft.croyances,valeurs:actorDraft.valeurs,question:actorDraft.question},
      own:actorDraft.own, run:{texte:actorDraft.runTexte,type:actorDraft.runType},
      updatedAt:new Date().toISOString(),
    };
    await saveActorAnalysis(id,a);
    setInbox(prev=>prev.map(x=>x.id===id?{...x,actorAnalysis:a}:x));
    setCorpus(await getActorCorpus());
    setActorId(null);
  }
  async function markLater(id){ await updateCaptureStatut(id,'plus-tard'); await load(); if(onCapture)onCapture(); }
  async function supprimerCapture(id){ if(confirmDelId!==id){setConfirmDelId(id);return;} await deleteCapture(id); setConfirmDelId(null); await load(); if(onCapture)onCapture(); }
  async function remettreInbox(id){ await updateCaptureStatut(id,'inbox'); await load(); if(onCapture)onCapture(); }

  const now=new Date();
  return html`<div class="scroll">
    <div class="hdr"><div class="brand">Zebracorn OS · Capture</div><div class="date-lbl">${fmtDate(now)}</div></div>

    <div class="composer">
      <div class="types" style="flex-wrap:wrap">${['note','lien','pdf','video','fichier','croquis'].map(t=>html`<button class=${'type-btn'+(type===t?' on':'')} onClick=${()=>{setType(t);setFile(null);setFileWarn('');}} key=${t}>${T_ICONS[t]} ${T_LBLS[t]}</button>`)}</div>
      ${type==='fichier'||type==='croquis'
        ?html`<label class="file-drop">
          <span class="fd-ic">${file?'✓':T_ICONS[type]}</span>
          <span class="fd-lbl">${file?file.name:type==='croquis'?'Photographier un dessin ou schéma':'Choisir une image ou un PDF'}</span>
          <span class="fd-hint">${type==='croquis'?'📷 Appareil photo · Photos · Dessins scannés':'iOS : Photos · Fichiers · Scanner'}</span>

        </label>
        ${fileWarn?html`<div class="file-warn">⚠ ${fileWarn}</div>`:''}
        ${file&&file.type.startsWith('image/')?html`<img src=${URL.createObjectURL(file)} style="width:100%;border-radius:8px;margin-top:8px;max-height:160px;object-fit:cover;"/>`:''}`
        :html`<textarea value=${content} onInput=${e=>setContent(e.target.value)} placeholder=${T_PH[type]} onKeyDown=${e=>{if((e.metaKey||e.ctrlKey)&&e.key==='Enter')save();}} rows=3/>`
      }
      ${chList.length>0?html`<div class="link-wrap">
        <span class="link-lbl">◎ Projet</span>
        ${chList.slice(0,5).map(c=>html`<button class=${'ch-pill'+(linkCh===c.id?' on':'')} onClick=${()=>setLinkCh(linkCh===c.id?null:c.id)} key=${c.id}>${c.titre.slice(0,22)}</button>`)}
      </div>`:''}
      ${livreList.length>0?html`<div class="link-wrap">
        <span class="link-lbl">📚 Livre</span>
        ${livreList.slice(0,4).map(l=>html`<button class=${'ch-pill'+(linkLivre===l.id?' on':'')} onClick=${()=>setLinkLivre(linkLivre===l.id?null:l.id)} key=${l.id}>${l.titre.slice(0,22)}</button>`)}
      </div>`:''}
      <div class="composer-b">
        <input class="taginp" value=${tag} onInput=${e=>setTag(e.target.value)} placeholder="# tag (optionnel)" onKeyDown=${e=>e.key==='Enter'&&save()}/>

/* ── Fiche-chantier ─────────────────────────── */
function FicheChantier({id,onBack}){
  const [chantier,setChantier]=useState(null);
  const [etapes,setEtapes]=useState([]);
  const [prochaine,setProchaine]=useState('');
  const [nouvelleEtape,setNouvelleEtape]=useState('');
  const [linkedCaps,setLinkedCaps]=useState([]);

  const load=useCallback(async()=>{
    const ch=await db.chantiers.get(id);
    const et=await getEtapes(id);
    setChantier(ch); setEtapes(et);
    if(ch) setProchaine(ch.prochaine||'');
    setLinkedCaps(await getCapturesByChantier(id));
  },[id]);
  useEffect(()=>{ load(); },[load]);

  async function togEtape(eid,fait){
    await toggleEtape(eid,fait);
    setEtapes(prev=>prev.map(e=>e.id===eid?{...e,fait}:e));
  }
  async function saveProchaine(){ await updateChantier(id,{prochaine:prochaine.trim()}); }
  async function ajouterEtape(){
    if(!nouvelleEtape.trim()) return;
    await addEtape(id,nouvelleEtape.trim());
    setNouvelleEtape(''); await load();
  }

  if(!chantier) return html`<div class="scroll"><div class="greet">Chargement…</div></div>`;
  const done=etapes.filter(e=>e.fait).length;
  const pct=etapes.length?Math.round(done/etapes.length*100):0;
  const now=new Date();

  return html`<div class="scroll">
    <div class="hdr">
      <button class="back-btn" onClick=${onBack}>← Semaine</button>
      <div class="date-lbl">Chantier 🟢</div>
    </div>
    <div class="h1">${chantier.titre}</div>
    <div class="greet">Un geste à la fois — progress, ne coche pas.</div>

    ${etapes.length>0?html`<div class="prog-wrap">
      <div class="set-note">${done}/${etapes.length} étapes · ${pct} %</div>
      <div class="prog-bar"><div class="prog-fill" style=${'width:'+pct+'%'}/></div>
    </div>`:''}

    <div class="sec">
      <div class="sec-h"><span class="sec-t">Étapes</span><span class="sec-c">${done}/${etapes.length}</span></div>
      ${etapes.length===0?html`<div class="empty-state">Aucune étape — ajoute la première ↓</div>`:''}
      ${etapes.map(e=>html`<div class=${'task'+(e.fait?' done':'')} onClick=${()=>togEtape(e.id,!e.fait)} key=${e.id}>
        <div class="box"/>
        <span class="t-txt">${e.titre}</span>
      </div>`)}
      <div class="composer-b" style="margin-top:8px">
        <input class="taginp" style="flex:1" value=${nouvelleEtape} onInput=${e=>setNouvelleEtape(e.target.value)} placeholder="Ajouter une étape…" onKeyDown=${e=>e.key==='Enter'&&ajouterEtape()}/>
        <button class="save-btn" onClick=${ajouterEtape}>+</button>
      </div>
    </div>

    <div class="sec">
      <div class="sec-h"><span class="sec-t">Prochaine étape</span></div>
      <input class="taginp" style="width:100%;box-sizing:border-box" value=${prochaine} onInput=${e=>setProchaine(e.target.value)} onBlur=${saveProchaine} onKeyDown=${e=>e.key==='Enter'&&e.target.blur()} placeholder="Le prochain geste concret…"/>
      <div class="hint">Sauvegardé à la perte de focus · reflété dans la liste Semaine.</div>
    </div>

    ${linkedCaps.length>0?html`<div class="sec">
      <div class="sec-h"><span class="sec-t">Captures liées</span><span class="sec-c">${linkedCaps.length}</span></div>
      ${linkedCaps.map(c=>html`<div class="item-mini" key=${c.id}>
        <span class="item-ic">${T_ICONS[c.type]||'📝'}</span>
        <div style="flex:1;min-width:0">
          <div class="item-ti" style="font-size:12px">${c.contenu.slice(0,60)}${c.contenu.length>60?'…':''}</div>
          <div class="item-src">${relDate(c.date)}</div>
        </div>
      </div>`)}
    </div>`:''}

    <div class="foot">Zebracorn OS · Chantier · ${fmtDate(now)}</div>
  </div>`;
}

    const l=await db.livres.get(id);

    if(l){ setIntentionDraft(l.intention||''); setNotesDraft(l.notes||''); }

    const qs=await getQuestions(); setQuestions(qs);
    setQArchived(await getArchivedQuestions());
    const allCaps=await db.captures.toArray();
    const counts={};
    for(const c of allCaps) if(c.questionId) counts[c.questionId]=(counts[c.questionId]||0)+1;
    setQCounts(counts);
    setLivres(await getLivres());
    const cap=await getCap();
    setCapObjectifs((cap.objectifs||'').split('\n').map(s=>s.trim()).filter(Boolean));
  },[]);
  useEffect(()=>{ load(); },[load]);

  async function add(){
    if(!titre.trim()) return;
    if(prio==='vert') await addChantier({titre:titre.trim(), prio:'vert'});
    else              await addTache({titre:titre.trim(), prio});
    setTitre(''); await load();
  }
  async function togTache(id,fait){ await toggleTacheDone(id,fait); await load(); }
  function toggleExpandTache(id,notes){ if(expandTacheId===id){setExpandTacheId(null);setExpandTacheNotes('');}else{setExpandTacheId(id);setExpandTacheNotes(notes||'');} }
  async function sauveExpandNotes(id,val){ await setTacheNotes(id,val); setTaches(prev=>prev.map(t=>t.id===id?{...t,notes:val||null}:t)); }
  async function sauveObjectif(id,val){ await setTacheObjectif(id,val); setTaches(prev=>prev.map(t=>t.id===id?{...t,capObjectif:val||null}:t)); }
  async function delTache(id){ await deleteTache(id); await load(); }
  async function delChant(id){ await deleteChantier(id); await load(); }
  async function sauveEcheance(id,val){ await setTacheEcheance(id,val||null); setEditEchId(null); await load(); }
  function ouvrirEch(t){ setEditEchId(t.id); setEditEchVal(t.echeance||''); }
  async function archiveQ(id){ await archiveQuestion(id); await load(); }
  async function restoreQ(id){ await restoreQuestion(id); await load(); }

  if(ficheId!==null) return html`<${FicheChantier} id=${ficheId} onBack=${()=>{setFicheId(null);load();}}/>`;
  if(ficheLivreId!==null) return html`<${FicheLivre} id=${ficheLivreId} onBack=${()=>{setFicheLivreId(null);load();}}/>`;

  const rouge = sortByEch(taches.filter(t=>t.prio==='rouge'));
  const bleu  = sortByEch(taches.filter(t=>t.prio==='bleu'));
  const now = new Date();

  const groupeTaches = (arr, emoji, titreSec, sous) => html`<div class="sec">
    <div class="sec-h"><span class="sec-t">${emoji} ${titreSec}</span><span class="sec-c">${arr.length}</span></div>
    ${arr.length===0?html`<div class="empty-state">${sous}</div>`:''}
    ${arr.map(t=>{
      const ei=fmtEch(t.echeance);
      const isExp=expandTacheId===t.id;
      const isEdit=editTacheId===t.id;
      const parsed=parseNotes(t.notes);
      const todos=parsed.filter(l=>l.type==='todo');
      const doneC=todos.filter(l=>l.done).length;
      return html`<div class=${'task'+(t.fait?' done':'')+(isExp?' expanded':'')} key=${t.id}>
        <div class="box" onClick=${()=>togTache(t.id,!t.fait)}/>
        <span class="t-txt" onClick=${()=>toggleExpandTache(t.id,t.notes)}>${t.titre}</span>
        ${t.capObjectif&&!isExp?html`<span class="cap-obj-chip" title=${t.capObjectif}>🎯 ${t.capObjectif.slice(0,20)}${t.capObjectif.length>20?'…':''}</span>`:''}
        ${editEchId===t.id
          ?html`<input type="date" class="ech-inp" value=${editEchVal}
              onInput=${e=>setEditEchVal(e.target.value)}
              onChange=${e=>sauveEcheance(t.id,e.target.value)}
              onBlur=${()=>setEditEchId(null)}
              onKeyDown=${e=>e.key==='Enter'&&sauveEcheance(t.id,editEchVal)}
              autofocus/>`
          :html`<button class=${'ech-chip'+(ei?.urgent?' urgent':'')} onClick=${()=>ouvrirEch(t)}>
              ${ei?ei.label:'+'}
            </button>`
        }
        <span class="t-toggle" onClick=${()=>toggleExpandTache(t.id,t.notes)}>
          ${todos.length?html`<span class="t-count">${doneC}/${todos.length}</span>`:''}
          ${isExp?'▾':'▸'}
        </span>
        <span class="t-del" onClick=${()=>delTache(t.id)}>✕</span>
        ${isExp?html`<div class="task-notes">
          ${isEdit||!t.notes?html`
            <textarea class="task-notes-ta" rows="5" value=${expandTacheNotes}
              onInput=${e=>setExpandTacheNotes(e.target.value)}
              onBlur=${async()=>{await sauveExpandNotes(t.id,expandTacheNotes);setEditTacheId(null);}}
              placeholder=${'[ ] sous-tâche\n[ ] autre tâche\n— ou note libre…'}
              autofocus/>
          `:html`
            <div class="subtask-list">
              ${parsed.map((line,idx)=>line.type==='todo'?html`
                <div class=${'subtask'+(line.done?' done':'')} onClick=${async e=>{e.stopPropagation();const n=toggleSubtaskLine(t.notes,idx);await sauveExpandNotes(t.id,n);}} key=${idx}>
                  <span class="st-cb">${line.done?'☑':'☐'}</span>
                  <span class="st-txt">${line.text}</span>
                </div>
              `:line.text?html`<div class="note-line" key=${idx}>${line.text}</div>`:null)}
              <button class="edit-notes-btn" onClick=${e=>{e.stopPropagation();setEditTacheId(t.id);setExpandTacheNotes(t.notes||'');}}>✎ éditer</button>
            </div>
          `}
          ${capObjectifs.length>0?html`<div class="cap-obj-picker">
            <div class="cap-obj-label">🎯 Objectif Cap</div>
            <div class="cap-obj-opts">
              ${capObjectifs.map(obj=>html`<button key=${obj}
                class=${'cap-obj-opt'+(t.capObjectif===obj?' on':'')}
                onClick=${e=>{e.stopPropagation();sauveObjectif(t.id,t.capObjectif===obj?null:obj);}}
              >${obj.slice(0,40)}${obj.length>40?'…':''}</button>`)}
            </div>
          </div>`:null}
        </div>`:null}
      </div>`;
    })}
  </div>`;

  return html`<div class="scroll">
    <div class="hdr"><div class="brand">Zebracorn OS · Semaine</div><div class="date-lbl">${fmtDate(now)}</div></div>
    <div class="h1">La semaine.</div>
    <div class="greet">Pose tes objectifs. La couleur dit l'urgence.</div>

    <div class="composer">
      <div class="prio-pills">
        ${PRIO_PILLS.map(([p,e,l])=>html`<button class=${'prio-pill'+(prio===p?' on':'')} onClick=${()=>setPrio(p)} key=${p}>${e} ${l}</button>`)}
      </div>
      <div class="composer-b">
        <input class="taginp" style="flex:1" value=${titre} onInput=${e=>setTitre(e.target.value)} placeholder=${prio==='vert'?'Nouveau chantier long terme…':'Nouvelle tâche…'} onKeyDown=${e=>e.key==='Enter'&&add()}/>
        <button class="save-btn" onClick=${add}>Poser</button>
      </div>
    </div>

    ${groupeTaches(rouge,'🔴',"Cette échéance · d'ici demain","rien d'urgent ✶")}
    ${groupeTaches(bleu,'🔵','Cette semaine · avant le week-end','rien à caser ✶')}

    <div class="sec">
      <div class="sec-h"><span class="sec-t">🟢 Chantiers · long terme</span><span class="sec-c">${chantiers.length}</span></div>
      ${chantiers.length===0?html`<div class="empty-state">aucun chantier ✶</div>`:''}
      ${chantiers.map(c=>html`<div class="chantier-card" style="cursor:pointer" onClick=${()=>setFicheId(c.id)} key=${c.id}>
        <div class="ch-top"><span class="ch-ti">${c.titre}</span><span class="t-del" onClick=${e=>{e.stopPropagation();delChant(c.id);}}>✕</span></div>
        <div class="ch-prog">${c.prochaine?('→ '+c.prochaine):'Ouvre pour ajouter la 1ʳᵉ étape →'}</div>
      </div>`)}
    </div>

    <div class="sec">
      <div class="sec-h"><span class="sec-t">❓ Questions vivantes</span><span class="sec-c">${questions.length}</span></div>
      ${questions.length===0?html`<div class="empty-state">aucune question active ✶</div>`:''}
      ${questions.map(q=>html`<div class="q-card" key=${q.id}>
        <div class="q-card-top">
          <span class="q-intitule">${q.intitule}</span>
          <button class="q-arch" onClick=${()=>archiveQ(q.id)} title="Archiver — répondue ou plus vivante">↓ archiver</button>
        </div>
        <div class="q-intention">${q.intention}</div>
        <div class="q-meta">
          <span class="q-count">${qCounts[q.id]||0} capture${(qCounts[q.id]||0)>1?'s':''}</span>
        </div>
      </div>`)}
      ${qArchived.length>0?html`<div style="margin-top:10px">
        <button class="q-arch" style="width:100%;text-align:center;padding:6px" onClick=${()=>setQShowArch(o=>!o)}>
          📦 ${qArchived.length} archivée${qArchived.length>1?'s':''} ${qShowArch?'▲':'▼'}
        </button>
        ${qShowArch?html`<div style="margin-top:6px">
          ${qArchived.map(q=>html`<div class="q-card" style="opacity:.55;border-left-color:var(--border2)" key=${q.id}>
            <div class="q-card-top">
              <span class="q-intitule" style="font-weight:400;color:var(--ink2)">${q.intitule}</span>
              <button class="q-arch" onClick=${()=>restoreQ(q.id)} title="Réactiver">↑ rouvrir</button>
            </div>
            <div class="q-intention">${q.intention}</div>
          </div>`)}
        </div>`:''}
      </div>`:''}
    </div>

    <div class="sec">
      <div class="sec-h"><span class="sec-t">📚 Bibliothèque</span><span class="sec-c">${livres.length}</span></div>
      ${livres.length===0?html`<div class="empty-state">aucun livre — ajoute le premier ↓</div>`:''}
      ${livres.map(l=>html`<div class="livre-card" onClick=${()=>setFicheLivreId(l.id)} key=${l.id}>
        <div class="ch-top">
          <span class="ch-ti">${l.titre}</span>
          <span class="livre-statut" style=${'color:'+(l.statut==='lu'?'var(--ok)':l.statut==='en-cours'?'var(--ac2)':'var(--ink3)')}>
            ${l.statut==='lu'?'✓ Lu':l.statut==='en-cours'?'📖 En cours':'📚 À lire'}
          </span>
        </div>
        ${l.auteur?html`<div class="ch-prog" style="font-style:italic;color:var(--ink3)">${l.auteur}</div>`:''}
        ${l.statut==='en-cours'&&l.pages?html`<div class="ch-prog">${l.pagesLues||0}/${l.pages} p. · ${Math.round((l.pagesLues||0)/l.pages*100)} %</div>`:''}
        ${l.intention?html`<div class="ch-prog" style="font-style:italic">${l.intention.slice(0,55)}${l.intention.length>55?'…':''}</div>`:''}
      </div>`)}
      <div class="composer-b" style="margin-top:8px">
        <input class="taginp" style="flex:1" value=${newLivre} onInput=${e=>setNewLivre(e.target.value)}
          placeholder="Ajouter un livre…"
          onKeyDown=${async e=>{if(e.key==='Enter'&&newLivre.trim()){await addLivre({titre:newLivre.trim()});setNewLivre('');await load();}}}/>
        <button class="save-btn" onClick=${async()=>{if(!newLivre.trim())return;await addLivre({titre:newLivre.trim()});setNewLivre('');await load();}}>+</button>
      </div>
    </div>

    <div class="foot">Zebracorn OS · Semaine · v0.1</div>
  </div>`;
}

/* ── Réglages (sync cloud + sauvegarde JSON) ──── */

function Reglages(){
  const [cfg,setCfg]=useState(getSyncConfig());
  const [msg,setMsg]=useState('');
  const [busy,setBusy]=useState(false);
  const [cap,setCap]=useState({intention:'',objectifs:'',nonNeg:'',objectifsMois:''});
  const [stats,setStats]=useState(null);
  const [gcalUrl,setGcalUrl]=useState(()=>localStorage.getItem('zc_gcal_url')||'');
  const [gcalTest,setGcalTest]=useState('');
  const [ia,setIa]=useState(()=>getFiltreIaSettings());
  function saveIa(patch){ const u={...ia,...patch}; setIa(u); saveFiltreIaSettings(u); }
  const last=lastSync();
  useEffect(()=>{ getStats().then(setStats); getCap().then(setCap); },[]);

  const upd=(k,v)=>setCfg(c=>({...c,[k]:v}));
  function save(){ saveSyncConfig(cfg.url.trim(),cfg.key.trim(),cfg.space.trim()); setMsg('Configuration enregistrée ✓'); }

  async function doPush(){ setBusy(true); setMsg('Envoi vers le cloud…'); try{ await pushAll(); setMsg('Envoyé ✓ — tes autres appareils peuvent Tirer.'); }catch(e){ setMsg('⚠ '+e.message); } setBusy(false); }
  async function doPull(){ if(!confirm('Tirer le cloud va REMPLACER les données de cet appareil. Continuer ?')) return; setBusy(true); setMsg('Réception…'); try{ await pullAll(); setMsg('Reçu ✓ — rechargement…'); setTimeout(()=>location.reload(),800); }catch(e){ setMsg('⚠ '+e.message); setBusy(false); } }

  async function doExport(){ const dump=await exportAll(); const blob=new Blob([JSON.stringify(dump,null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='zebracorn-backup-'+new Date().toISOString().slice(0,10)+'.json'; document.body.appendChild(a); a.click(); a.remove(); setMsg('Sauvegarde téléchargée ✓'); }
  function doImport(e){ const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=async()=>{ if(!confirm('Importer va REMPLACER les données de cet appareil. Continuer ?')) return; try{ await importAll(JSON.parse(r.result)); setMsg('Importé ✓ — rechargement…'); setTimeout(()=>location.reload(),800);}catch(err){ setMsg('⚠ fichier invalide'); } }; r.readAsText(f); }

  async function doCorpus(){
    const all=await db.captures.toArray();
    const chans=await db.chantiers.toArray();
    const items=all.filter(c=>c.statut==='traité'||c.notes).sort((a,b)=>a.date<b.date?-1:1);
    const capData=await getCap();
    const allQuestions=await db.questions.toArray();
    const date=new Date().toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'});
    const moisStr=new Date().toLocaleDateString('fr-FR',{month:'long',year:'numeric'});
    const moisISO=new Date().toISOString().slice(0,7);

    let md=`# Corpus Zebracorn\n> Exporté le ${date} · ${items.length} entrées\n\n`;

    // ── Contexte stratégique ──────────────────────────────────────────────
    if(capData.intention){
      md+=`---\n\n## 🧭 Contexte stratégique\n\n`;
      md+=`**Cap 2026 :** ${capData.intention}\n\n`;
      if(capData.objectifs) md+=`**Objectifs annuels :**\n${capData.objectifs}\n\n`;
      if(capData.objectifsMois) md+=`**Objectifs de ${moisStr} :**\n${capData.objectifsMois}\n\n`;
      if(capData.nonNeg) md+=`**Non-négociables :** ${capData.nonNeg}\n\n`;
      md+=`---\n\n`;
    }

    // ── Hors-scope du mois ────────────────────────────────────────────────
    const hsMois=items.filter(c=>c.horsScope&&c.date?.startsWith(moisISO));
    if(hsMois.length>0){
      md+=`## 📍 Hors-scope · ${moisStr} (${hsMois.length})\n\n`;
      md+=`*Captures traitées hors cap — signal de dérive à analyser.*\n\n`;
      for(const c of hsMois) md+=`- **${c.contenu.slice(0,80)}**\n`;
      md+=`\n---\n\n`;
    }

    // ── Corpus ────────────────────────────────────────────────────────────
    for(const c of items){
      const ico=T_ICONS[c.type]||'📝';
      const ch=chans.find(x=>x.id===c.chantierId);
      md+=`## ${ico} ${c.contenu.slice(0,120)}\n`;
      if(c.horsScope) md+=`> 📍 *Hors-scope*\n`;
      if(ch) md+=`> Chantier : **${ch.titre}**\n`;
      if(c.notes) md+=`\n**Notes** : ${c.notes}\n`;
      if(c.annotation&&!c.actorAnalysis) md+=`\n**ACTOR** : ${c.annotation}\n`;
      if(c.actorAnalysis){
        const a=c.actorAnalysis;
        md+=`\n#### ⊙ ACTOR\n`;
        if(a.aim) md+=`**Aim :** ${a.aim}\n\n`;
        if(a.compress) md+=`**Compress :** ${a.compress}\n\n`;
        const t=a.test||{};
        if(t.faits||t.interp||t.croyances||t.valeurs){
          md+=`**Think ·** `;
          if(t.faits) md+=`F: ${t.faits}  `;
          if(t.interp) md+=`I: ${t.interp}  `;
          if(t.croyances) md+=`C: ${t.croyances}  `;
          if(t.valeurs) md+=`V: ${t.valeurs}`;
          md+='\n\n';
        }
        if(t.question) md+=`*❝ ${t.question}*\n\n`;
        if(a.own) md+=`**Position :** ${a.own}\n\n`;
        if(a.run?.texte) md+=`**Run :** ${a.run.texte}${a.run.type?' *('+a.run.type+')*':''}\n\n`;
      }
      if(c.source) md+=`\n*Source : ${c.source}*\n`;
      md+=`\n*${new Date(c.date).toLocaleDateString('fr-FR')}* · statut : ${c.statut}\n\n---\n\n`;
    }
    // ── Bibliothèque ──────────────────────────────────────────────────────
    const lvsAll=await db.livres.toArray();
    if(lvsAll.length>0){
      const lvs=[...lvsAll].sort((a,b)=>{const o={'en-cours':0,'lu':1,'a-lire':2};return(o[a.statut]??2)-(o[b.statut]??2);});
      md+=`---\n\n## 📚 Bibliothèque\n\n`;
      for(const l of lvs){
        const ico=l.statut==='lu'?'✓':l.statut==='en-cours'?'📖':'📚';
        md+=`### ${ico} ${l.titre}${l.auteur?' — *'+l.auteur+'*':''}\n`;
        md+=`> Statut : **${l.statut==='lu'?'Lu':l.statut==='en-cours'?'En cours':'À lire'}**`;
        if(l.pages) md+=` · ${l.pagesLues||0}/${l.pages} pages (${Math.round((l.pagesLues||0)/l.pages*100)} %)`;
        md+='\n';
        if(l.intention) md+=`\n**Intention :** ${l.intention}\n`;
        if(l.notes) md+=`\n**Notes :** ${l.notes}\n`;
        const livreCaps=all.filter(c=>c.livreId===l.id&&(c.statut==='traité'||c.notes));
        if(livreCaps.length){
          md+=`\n**Captures liées :**\n`;
          for(const c of livreCaps) md+=`- ${c.contenu.slice(0,100)}${c.notes?' *('+c.notes.slice(0,50)+')*':''}\n`;
        }
        md+='\n---\n\n';
      }
    }

    // ── Questions vivantes ────────────────────────────────────────────────────
    if(allQuestions.length>0){
      const vivantes=allQuestions.filter(q=>q.statut!=='archivee');
      const archivees=allQuestions.filter(q=>q.statut==='archivee');
      md+=`---\n\n## ❓ Questions vivantes (${vivantes.length})\n\n`;
      md+=`*Les questions qui orientent le regard — fondation du second cerveau.*\n\n`;
      for(const q of vivantes){
        md+=`### ${q.intitule}\n`;
        if(q.intention) md+=`> ${q.intention}\n\n`;
        const qCaps=all.filter(c=>c.questionId===q.id&&(c.statut==='traité'||c.notes));
        if(qCaps.length){
          md+=`**Captures liées (${qCaps.length}) :**\n`;
          for(const c of qCaps) md+=`- ${c.contenu.slice(0,100)}${c.notes?' *('+c.notes.slice(0,60)+')*':''}\n`;
          md+='\n';
        }
      }
      if(archivees.length){
        md+=`\n*Questions archivées : ${archivees.map(q=>q.intitule).join(' · ')}*\n\n`;
      }
    }

    const fname=`zebracorn-corpus-${new Date().toISOString().slice(0,10)}.md`;
    const blob=new Blob([md],{type:'text/plain'});
    if(navigator.share){
      try{ await navigator.share({files:[new File([blob],fname,{type:'text/plain'})],title:'Corpus Zebracorn'}); setMsg('Corpus partagé ✓'); return; }catch(e){ if(e.name==='AbortError') return; }
    }
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=fname; document.body.appendChild(a); a.click(); a.remove();
    setMsg('Corpus téléchargé ✓');
  }

  const now=new Date();
  return html`<div class="scroll">
    <div class="hdr"><div class="brand">Zebracorn OS · Réglages</div><div class="date-lbl">${fmtDate(now)}</div></div>
    <div class="h1">Réglages.</div>
    <div class="greet">Synchronise tes appareils. Tes données restent à toi.</div>

    <div class="sec">
      <div class="sec-h"><span class="sec-t">Cap 2026 · North Star</span></div>
      <div class="set-field">
        <div class="set-label">Intention de l'année</div>
        <textarea class="cmp-inp" rows=2 value=${cap.intention} onInput=${e=>setCap(c=>({...c,intention:e.target.value}))} placeholder="En une phrase — la posture que tu veux tenir…"/>
      </div>
      <div class="set-field">
        <div class="set-label">Grands objectifs <span style="color:var(--ink3)">(un par ligne)</span></div>
        <textarea class="cmp-inp" rows=4 value=${cap.objectifs} onInput=${e=>setCap(c=>({...c,objectifs:e.target.value}))} placeholder=${"Écrire le livre\nValider le concept X\n…"}/>
      </div>
      <div class="set-field">
        <div class="set-label">Non-négociables</div>
        <textarea class="cmp-inp" rows=2 value=${cap.nonNeg} onInput=${e=>setCap(c=>({...c,nonNeg:e.target.value}))} placeholder="Santé · famille · …"/>
      </div>
      <div class="set-field">
        <div class="set-label">Objectifs du mois de ${new Date().toLocaleDateString('fr-FR',{month:'long'})} <span style="color:var(--ink3)">(2–3 max)</span></div>
        <textarea class="cmp-inp" rows=3 value=${cap.objectifsMois||''} onInput=${e=>setCap(c=>({...c,objectifsMois:e.target.value}))} placeholder=${"Finir la partie 1 du mémoire\nPostuler chez X\n…"}/>
      </div>
      <button class="save-btn" style="width:100%;margin-top:4px" onClick=${async()=>{await saveCap(cap);setMsg('Cap 2026 enregistré ✓ — syncé avec Supabase');}}>Enregistrer le cap</button>
      <div class="set-note">Cap annuel + objectifs du mois — visibles dans Maintenant, syncés via Supabase, inclus dans l'export NLM.</div>
    </div>

    <div class="sec">
      <div class="sec-h"><span class="sec-t">Corpus</span>${stats?html`<span class="sec-c" style="color:var(--ink3)">${stats.total} captures</span>`:''}</div>
      ${stats?html`
        <div class="stats-grid">
          <div class="stat-cell"><span class="stat-n">${stats.total}</span><span class="stat-l">Capturées</span></div>
          <div class="stat-cell"><span class="stat-n">${stats.traites}</span><span class="stat-l">Traitées</span></div>
          <div class="stat-cell"><span class="stat-n">${stats.avecNotes}</span><span class="stat-l">Notes</span></div>
          <div class="stat-cell"><span class="stat-n">${stats.avecLiens}</span><span class="stat-l">Liées</span></div>
        </div>
        <div class="sec-h" style="margin-top:1.2rem">
          <span class="sec-t">Badges</span>
          <span class="sec-c" style="color:var(--ink3)">${BADGES.filter(b=>b.check(stats)).length}/${BADGES.length}</span>
        </div>
        <div class="badges-grid">
          ${BADGES.map(b=>{
            const ok=b.check(stats);
            return html`<div class=${'badge-cell'+(ok?'':' locked')} key=${b.id}>
              <span class="badge-e">${b.e}</span>
              <span class="badge-l">${b.label}</span>
              ${!ok&&b.prog?html`<span class="badge-prog">${b.prog(stats)}</span>`:''}
            </div>`;
          })}
        </div>
      `:''}
    </div>

    <div class="sec">
      <div class="sec-h"><span class="sec-t">Sync cloud · Supabase</span><span class="sec-c">${syncConfigured()?'configuré':'à configurer'}</span></div>
      <div class="set-field"><div class="set-label">URL du projet</div><input class="taginp" value=${cfg.url} onInput=${e=>upd('url',e.target.value)} placeholder="https://xxxx.supabase.co"/></div>
      <div class="set-field"><div class="set-label">Clé anon (publique)</div><input class="taginp" value=${cfg.key} onInput=${e=>upd('key',e.target.value)} placeholder="eyJ…"/></div>
      <div class="set-field"><div class="set-label">Espace privé · ta clé secrète</div><input class="taginp" value=${cfg.space} onInput=${e=>upd('space',e.target.value)} placeholder="une phrase longue, connue de toi seul"/></div>
      <button class="save-btn" style="width:100%;margin-top:4px" onClick=${save}>Enregistrer la config</button>
      <div class="btn-row">
        <button class="btn pri" disabled=${busy||!syncConfigured()} onClick=${doPush}>↑ Pousser</button>
        <button class="btn" disabled=${busy||!syncConfigured()} onClick=${doPull}>↓ Tirer</button>
      </div>
      <div class="set-note">Pousse depuis l'appareil à jour, Tire sur l'autre. Envoi : ${last.push?new Date(last.push).toLocaleString():'—'} · Réception : ${last.pull?new Date(last.pull).toLocaleString():'—'}</div>
    </div>

    <div class="sec">
      <div class="sec-h"><span class="sec-t">Google Calendar</span><span class="sec-c">${gcalUrl?'configuré':'—'}</span></div>
      <div class="set-field">
        <div class="set-label">URLs iCal secrètes <span style="color:var(--ink3)">(une par ligne · un calendrier par URL)</span></div>
        <textarea class="cmp-inp" rows=3 value=${gcalUrl} onInput=${e=>setGcalUrl(e.target.value)} placeholder=${"https://calendar.google.com/calendar/ical/…\nhttps://calendar.google.com/calendar/ical/… (2e agenda)"}/>
      </div>
      <div class="btn-row" style="margin-top:4px">
        <button class="save-btn" style="flex:2" onClick=${()=>{localStorage.setItem('zc_gcal_url',gcalUrl.trim());setGcalTest('');setMsg('Google Calendar configuré ✓');}}>Enregistrer</button>
        <button class="btn" style="flex:1" onClick=${async()=>{
          setGcalTest('⏳ Test…');
          try{
            const raw=gcalUrl.trim()||localStorage.getItem('zc_gcal_url')||'';
            const urls=raw.split('\n').map(u=>u.trim()).filter(u=>u.startsWith('https://calendar.google.com/'));
            if(!urls.length){setGcalTest('⚠ Aucune URL valide');return;}
            let totalEvts=0,todayEvts=[];
            for(const url of urls){
              const r=await fetch(`/api/ical?url=${encodeURIComponent(url)}`);
              if(!r.ok) continue;
              const text=await r.text();
              const evts=parseIcal(unfoldIcal(text));
              totalEvts+=evts.length;
              todayEvts.push(...filterToday(evts));
            }
            setGcalTest(`✓ ${urls.length} agenda(s) · ${totalEvts} événements · ${todayEvts.length} aujourd'hui${todayEvts.length?(' : '+todayEvts.map(e=>e.summary).join(', ')):''}`);}
          catch(e){setGcalTest('⚠ '+e.message);}
        }}>Tester</button>
      </div>
      ${gcalTest?html`<div class="set-note" style="margin-top:6px;color:${gcalTest.startsWith('✓')?'var(--ok)':'var(--ac)'}">${gcalTest}</div>`:''}
      <div class="set-note">Google Calendar → chaque agenda → ⚙ Paramètres → « Adresse secrète au format iCal » · Colle une URL par ligne pour afficher plusieurs agendas dans Maintenant.</div>
    </div>

    <div class="sec">
      <div class="sec-h"><span class="sec-t">Corpus · NotebookLM</span></div>
      <button class="save-btn" style="width:100%" onClick=${doCorpus}>↗ Exporter le corpus (.md)</button>
      <div class="set-note">Génère un fichier Markdown de toutes tes captures traitées + notes · partage vers Fichiers ou NLM directement.</div>
    </div>

    <div class="sec">
      <div class="sec-h"><span class="sec-t">🤖 Filtre IA · ACTOR</span></div>
      <div class="hint" style="margin-bottom:10px">
        ✨ Haiku génère le Compress (C) · Sonnet analyse le Test FICV (T).<br/>
        Clé API : variable d'env Vercel <code style="font-size:9px;background:var(--bg2);padding:1px 4px;border-radius:3px">ANTHROPIC_API_KEY</code>
      </div>
      <div class=${'rout'+(ia.enabled?' on':'')} onClick=${()=>saveIa({enabled:!ia.enabled})} style="cursor:pointer">
        <div class="dot"/><span class="r-txt">${ia.enabled?'Filtre IA activé':'Filtre IA désactivé'}</span>
      </div>
      ${ia.enabled?html`
        <div style="margin-top:10px;display:flex;flex-direction:column;gap:4px">
          <div class="cfg-row">
            <label>Compress — modèle</label>
            <select value=${ia.compressModel} onChange=${e=>saveIa({compressModel:e.target.value})}>
              <option value="claude-haiku-4-5-20251001">Haiku 4.5 · rapide / économe</option>
              <option value="claude-sonnet-4-6">Sonnet 4.6 · plus nuancé</option>
            </select>
          </div>
          <div class="cfg-row">
            <label>Compress — température</label>
            <select value=${ia.compressTemp} onChange=${e=>saveIa({compressTemp:e.target.value})}>
              <option value="0.2">0.2 · précis / factuel</option>
              <option value="0.3">0.3 · équilibré (défaut)</option>
              <option value="0.6">0.6 · créatif / interprétatif</option>
            </select>
          </div>
          <div class="cfg-row">
            <label>Test FICV — modèle</label>
            <select value=${ia.testModel} onChange=${e=>saveIa({testModel:e.target.value})}>
              <option value="claude-sonnet-4-6">Sonnet 4.6 · défaut</option>
              <option value="claude-haiku-4-5-20251001">Haiku 4.5 · rapide / moins cher</option>
            </select>
          </div>
          <div class="hint" style="margin-top:6px">O (Position) et R (Run) restent manuels · A (Aim) se complète après avoir vu la question T</div>
        </div>
      `:''}
    </div>

    <div class="sec">
      <div class="sec-h"><span class="sec-t">Sauvegarde locale · JSON</span></div>
      <div class="btn-row">
        <button class="btn" onClick=${doExport}>⤓ Exporter</button>
        <label class="btn" style="text-align:center;cursor:pointer">⤒ Importer<input type="file" accept="application/json" style="display:none" onChange=${doImport}/></label>
      </div>
      <div class="set-note">Filet de sécurité hors-ligne : un fichier à garder ou transférer à la main.</div>
    </div>

    ${msg?html`<div class="set-msg">${msg}</div>`:''}

    <div class="set-note" style="margin-top:1rem">⚠ Sécurité v1 : ta clé secrète d'espace protège tes données — choisis-la longue et unique. La clé anon Supabase est publique par nature. Pas de chiffrement bout-en-bout en v1.</div>

    <div class="foot">Zebracorn OS · Réglages · v0.1</div>
  </div>`;
}

/* ── App ─────────────────────────────────────── */
function App(){
  const [tab,setTab]=useState('maintenant');
  const [inboxCount,setCount]=useState(0);
  const refresh=useCallback(async()=>setCount(await getInboxCount()),[]);
  useEffect(()=>{ refresh(); },[refresh]);
  useEffect(()=>{
    const p=new URLSearchParams(window.location.search);
    const txt=p.get('text'), url=p.get('url'), title=p.get('title');
    if(url&&url.trim()){
      const isNLM=url.includes('notebooklm.google');
      const src=isNLM?'NotebookLM':(title?.trim()||'');
      addCapture('lien',url.trim(),src,{...(isNLM?{nlm:true}:{})}).then(()=>{ refresh(); setTab('capture'); });
      history.replaceState(null,'',location.pathname);
    } else if(txt&&txt.trim()){
      addCapture('note',txt.trim(),'',{}).then(()=>{ refresh(); setTab('capture'); });
      history.replaceState(null,'',location.pathname);
    }
  },[]);
  useEffect(()=>{
    if(!syncConfigured()) return;
    const fn=()=>{ if(document.hidden) pushAll().catch(()=>{}); };
    document.addEventListener('visibilitychange',fn);
    return()=>document.removeEventListener('visibilitychange',fn);
  },[]);

  return html`<div class="phone">
    ${tab==='maintenant'
      ? html`<${Maintenant} inboxCount=${inboxCount} onGoCapture=${()=>setTab('capture')}/>`
      : tab==='semaine'
      ? html`<${Semaine}/>`
      : tab==='reglages'
      ? html`<${Reglages}/>`
      : tab==='sport'
      ? html`<${Nutrition}/>`
      : html`<${Capture} onCapture=${refresh}/>`
    }
    <nav class="tabnav">
      <button class=${tab==='maintenant'?'on':''} onClick=${()=>setTab('maintenant')}>
        <span class="tico">🌱</span><span class="tlbl">Maint.</span>
      </button>
      <button class=${tab==='semaine'?'on':''} onClick=${()=>setTab('semaine')}>
        <span class="tico">▦</span><span class="tlbl">Sem.</span>
      </button>
      <button class=${tab==='capture'?'on':''} onClick=${()=>setTab('capture')}>
        <span class="tico" style="position:relative">◇${inboxCount>0?html`<span class="badge">${inboxCount}</span>`:''}</span>
        <span class="tlbl">Cap.</span>
      </button>
      <button class=${tab==='sport'?'on':''} onClick=${()=>setTab('sport')}>
        <span class="tico">🥗</span><span class="tlbl">Sport</span>
      </button>
      <button class=${tab==='reglages'?'on':''} onClick=${()=>setTab('reglages')}>
        <span class="tico">⚙</span><span class="tlbl">Régl.</span>
      </button>
    </nav>
  </div>`;
}

if(syncConfigured()&&(lastSync().push||lastSync().pull)){
  try{ await pullAll(); }catch(e){}
}
await seedOnce();
await seedOnce_v2();
await seedQuestionsOnce();
await seedLivresOnce();
await seedChantiersEte2026();
render(html`<${App}/>`, document.getElementById('root'));

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('/sw.js').then(reg=>{
    reg.addEventListener('updatefound',()=>{
      const sw=reg.installing;
      sw.addEventListener('statechange',()=>{
        if(sw.state==='activated'&&navigator.serviceWorker.controller) location.reload();
      });
    });
  });
}
</script>
</body>
</html>
